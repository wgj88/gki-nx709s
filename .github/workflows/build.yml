name: Build GKI 5.10.168 (android12-9) + KernelSU + Docker

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: "KernelSU tag"
        default: "v3.3.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      KERNEL_SHA: 61344663df42
      MANIFEST_BRANCH: common-android12-5.10-2023-05
      KSU_TAG: ${{ github.event.inputs.ksu_tag }}
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 rsync bc bison flex libssl-dev libelf-dev lz4 cpio kmod
          # runner 只有 ~4.6GB 可用磁盘 / 7.9GB 内存，清出空间并加 swap
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/google/chrome \
                      /usr/local/share/powershell /usr/share/swift /usr/lib/jvm /opt/microsoft 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          ( sudo swapon --show || true )
          for f in /swapfile /mnt/swapfile; do
            if sudo dd if=/dev/zero of="$f" bs=1M count=8192 status=none 2>/dev/null; then
              sudo chmod 600 "$f" && sudo mkswap "$f" >/dev/null 2>&1 && sudo swapon "$f" 2>/dev/null \
                && { echo "[+] swap on $f"; break; } || echo "[warn] swapon $f failed"
            else
              echo "[warn] cannot create $f"
            fi
          done
          free -m; df -h / | tail -1
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name ci
          git config --global user.email ci@example.com

      - name: Sync toolchain manifest (skip kernel/common)
        run: |
          mkdir -p ~/k && cd ~/k
          repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --depth=1
          PROJECTS=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('.repo/manifests/default.xml').getroot()
          names = [p.get('name') for p in root.iter('project')
                   if p.get('name') and p.get('name') != 'kernel/common']
          print(' '.join(names))
          PY
          )
          echo "[*] projects: $PROJECTS"
          for p in $PROJECTS; do
            repo sync -c --no-tags --no-clone-bundle -j"$(nproc)" "$p" || echo "[warn] skip $p"
          done
          echo "[*] 工具链检查:"
          ls ~/k
          ls ~/k/build/build.sh || echo "[!] build.sh 缺失"
          find ~/k/prebuilts-master/clang/host/linux-x86 -maxdepth 3 -name clang -type f | head -3

      - name: Pin exact kernel source (5.10.168)
        run: |
          cd ~/k
          rm -rf common
          curl -sSL -o /tmp/common.tar.gz "https://codeload.github.com/aosp-mirror/kernel_common/tar.gz/${KERNEL_SHA}"
          tar xzf /tmp/common.tar.gz -C ~/k
          mv ~/k/kernel_common-${KERNEL_SHA} ~/k/common
          rm -f /tmp/common.tar.gz
          sed -n '1,5p' ~/k/common/Makefile

      - name: Show runner resources
        run: |
          nproc; free -m; df -h / /home/runner 2>/dev/null | sort -u

      - name: Integrate KernelSU and container configs
        run: |
          cd ~/k
          # FULL LTO 会吃爆 8GB 内存/磁盘；改用 THIN LTO（保住 CFI_CLANG，KMI 符号 __cfi_slowpath 不被裁掉）
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y$/CONFIG_LTO_CLANG_THIN=y/' ~/k/common/arch/arm64/configs/gki_defconfig
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_TAG}/kernel/setup.sh" -o /tmp/ksu_setup.sh
          bash /tmp/ksu_setup.sh "${KSU_TAG}"
          cat >> ~/k/common/arch/arm64/configs/gki_defconfig <<'EOF'
          # 本机 KernelSU 是 LKM 模式（ramdisk 里 kernelsu.ko 由 init 加载）。
          # 内置(=y) 与 LKM 路径冲突会开机重复重启；编成模块(=m) 又因 GKI 只导出
          # KMI 白名单符号而 modpost 失败。故内核不带 KSU，ramdisk 原样保留 LKM。
          # 注意 KSU 的 Kconfig 是 default y，不显式关掉就会被编成内置
          # CONFIG_KSU is not set
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_POSIX_MQUEUE_SYSCTL=y
          CONFIG_USER_NS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          EOF
          cat > ~/k/common/build.config.nx709s <<'EOF'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64
          POST_DEFCONFIG_CMDS=""
          MAKE_GOALS="${MAKE_GOALS}
          Image
          "
          FILES="${FILES}
          arch/arm64/boot/Image
          "
          EOF
          grep -E "CONFIG_(KSU|PID_NS|IPC_NS|POSIX_MQUEUE|SYSVIPC|USER_NS)=" ~/k/common/arch/arm64/configs/gki_defconfig

      - name: Build kernel
        run: |
          cd ~/k
          BUILD_CONFIG=common/build.config.nx709s build/build.sh

      - name: Collect artifacts
        run: |
          mkdir -p ~/stage
          find ~/k/out -path "*arch/arm64/boot/Image" -exec cp {} ~/stage/Image \;
          find ~/k/out -name "Image.lz4" -exec cp {} ~/stage/Image.lz4 \;
          find ~/k/out -name "kernelsu.ko" -exec cp {} ~/stage/kernelsu.ko \;
          ls -l ~/stage/kernelsu.ko || echo "[!] kernelsu.ko 未找到"
          find ~/k/out -maxdepth 4 -name ".config" -exec cp {} ~/stage/config \;
          ls -lh ~/stage
          echo "=== config check ==="
          if grep -q "^CONFIG_KSU=y" ~/stage/config; then
            echo "[!] KSU 仍被内置（会与 LKM ramdisk 冲突），中止"; exit 1
          fi
          grep -E "^(CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_POSIX_MQUEUE|CONFIG_KSU|CONFIG_SYSVIPC|CONFIG_USER_NS|CONFIG_CGROUP_DEVICE|CONFIG_CGROUP_PIDS|CONFIG_CFI_CLANG|CONFIG_LTO_CLANG_THIN|CONFIG_LTO_CLANG_FULL|CONFIG_LTO_NONE)=" ~/stage/config

      - uses: actions/upload-artifact@v4
        with:
          name: gki-5.10.168-nx709s
          path: ~/stage/*
          retention-days: 30
