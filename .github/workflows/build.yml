name: Build GKI 5.10.168 (android12-9) + Docker namespaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        lto: [thin, full]
    env:
      KERNEL_SHA: 61344663df42
      MANIFEST_BRANCH: common-android12-5.10-2023-05
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 rsync bc bison flex libssl-dev libelf-dev lz4 cpio kmod patch
          # runner 只有 ~4.6GB 可用磁盘 / 7.9GB 内存，清出空间并加 swap
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/google/chrome \
                      /usr/local/share/powershell /usr/share/swift /usr/lib/jvm /opt/microsoft 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          ( sudo swapon --show || true )
          for f in /swapfile /mnt/swapfile; do
            if sudo dd if=/dev/zero of="$f" bs=1M count=8192 status=none 2>/dev/null; then
              sudo chmod 600 "$f" && sudo mkswap "$f" >/dev/null 2>&1 && sudo swapon "$f" 2>/dev/null \
                && { echo "[+] swap on $f"; break; } || echo "[warn] swapon $f failed"
            else
              echo "[warn] cannot create $f"
            fi
          done
          free -m; df -h / | tail -1
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name ci
          git config --global user.email ci@example.com

      - name: Sync toolchain manifest (skip kernel/common)
        run: |
          mkdir -p ~/k && cd ~/k
          repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --depth=1
          PROJECTS=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('.repo/manifests/default.xml').getroot()
          names = [p.get('name') for p in root.iter('project')
                   if p.get('name') and p.get('name') != 'kernel/common']
          print(' '.join(names))
          PY
          )
          echo "[*] projects: $PROJECTS"
          for p in $PROJECTS; do
            repo sync -c --no-tags --no-clone-bundle -j"$(nproc)" "$p" || echo "[warn] skip $p"
          done
          ls ~/k/build/build.sh || echo "[!] build.sh 缺失"

      - name: Pin exact kernel source (5.10.168)
        run: |
          cd ~/k
          rm -rf common
          curl -sSL -o /tmp/common.tar.gz "https://codeload.github.com/aosp-mirror/kernel_common/tar.gz/${KERNEL_SHA}"
          tar xzf /tmp/common.tar.gz -C ~/k
          mv ~/k/kernel_common-${KERNEL_SHA} ~/k/common
          rm -f /tmp/common.tar.gz
          sed -n '1,5p' ~/k/common/Makefile

      - name: Apply GKI docker/LXC patches (1orz/android-gki-custom)
        run: |
          cd ~/k
          git clone --depth 1 https://github.com/1orz/android-gki-custom.git gki-custom
          ls gki-custom/patches/android12-5.10/
          cd ~/k/common
          for p in ~/k/gki-custom/patches/android12-5.10/*.patch; do
            echo "--- applying $p"
            git apply -v "$p" || patch -p1 --forward --batch -i "$p" || echo "[warn] 应用失败: $p"
          done
          echo "=== 校验补丁是否生效 ==="
          grep -n "ANDROID_KABI_USE(1, unsigned long mq_bytes)" include/linux/sched/user.h || echo "[!] mq_bytes 补丁未生效"
          grep -n "ANDROID_KABI_USE(6, struct sysv_sem sysvsem)" include/linux/sched.h || echo "[!] sysvsem 补丁未生效"
          grep -n "return 1;" kernel/module.c | head -2

      - name: Container configs (LTO=${{ matrix.lto }})
        run: |
          cd ~/k
          DEF=~/k/common/arch/arm64/configs/gki_defconfig
          # 命名空间/容器必需（官方这行是 not set）
          cat >> "$DEF" <<'EOF'
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_POSIX_MQUEUE_SYSCTL=y
          CONFIG_USER_NS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF
          # LTO 模式：官方是 FULL，THIN 更省内存（本工作流两种都编）
          if [ "${{ matrix.lto }}" = "thin" ]; then
            sed -i 's/^CONFIG_LTO_CLANG_FULL=y$/CONFIG_LTO_CLANG_THIN=y/' "$DEF"
          fi
          grep -nE "LTO|^CONFIG_PID_NS" "$DEF"
          # 内核不带 KernelSU：本机是 LKM 模式，内置会与 ramdisk 加载路径冲突
          echo "# CONFIG_KSU is not set" >> "$DEF"

      - name: Create build config (nx709s)
        run: |
          cat > ~/k/common/build.config.nx709s <<'EOF'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64
          POST_DEFCONFIG_CMDS=""
          MAKE_GOALS="${MAKE_GOALS}
          Image
          "
          FILES="${FILES}
          arch/arm64/boot/Image
          "
          EOF
          cat ~/k/common/build.config.nx709s

      - name: Build kernel
        run: |
          cd ~/k
          BUILD_CONFIG=common/build.config.nx709s build/build.sh
          ls -l ~/k/out/android12-5.10/common/arch/arm64/boot/Image

      - name: Collect artifacts
        run: |
          mkdir -p ~/stage
          find ~/k/out -path "*arch/arm64/boot/Image" -exec cp {} ~/stage/Image \;
          find ~/k/out -name "Image.lz4" -exec cp {} ~/stage/Image.lz4 \;
          find ~/k/out -maxdepth 4 -name ".config" -exec cp {} ~/stage/config \;
          ls -lh ~/stage
          echo "=== config check ==="
          grep -E "^(CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_POSIX_MQUEUE|CONFIG_SYSVIPC|CONFIG_USER_NS|CONFIG_CGROUP_DEVICE|CONFIG_CGROUP_PIDS|CONFIG_KSU|CONFIG_LTO_CLANG_THIN|CONFIG_LTO_CLANG_FULL|CONFIG_CFI_CLANG)=" ~/stage/config
          if grep -q "^CONFIG_KSU=y" ~/stage/config; then echo "[!] KSU 被内置，中止"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: gki-5.10.168-nx709s-${{ matrix.lto }}
          path: ~/stage/*
          retention-days: 30
